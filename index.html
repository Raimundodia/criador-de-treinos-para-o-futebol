<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coach Tactics Pro - UEFA Pro Edition</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome 6 Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Fonts Inter & Rajdhani -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        pitch: { DEFAULT: '#059669', dark: '#022c22', light: '#10b981', line: 'rgba(255,255,255,0.7)' },
        gold: { DEFAULT: '#f59e0b', light: '#fbbf24', dark: '#b45309' }
      },
      fontFamily: { 
        sans: ['Inter', 'sans-serif'],
        display: ['Rajdhani', 'sans-serif']
      }
    }
  }
}
</script>
<style>
* { touch-action: manipulation; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: #020617; }
::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background: #10b981; }

.pitch-bg {
  background-color: #022c22;
  background-image: repeating-linear-gradient(0deg, #022c22, #022c22 30px, #033a2d 30px, #033a2d 60px);
  border: 2px solid #059669;
  box-shadow: 0 0 25px rgba(5, 150, 105, 0.2);
}

.glow-emerald {
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
}

.card-tactics {
  background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
  border: 1px solid #1e293b;
}

@media print {
  .no-print { display: none !important; }
  #printable-area { display: block !important; background: #fff !important; color: #000 !important; }
  body { background: #fff !important; color: #000 !important; }
}
</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col pb-20 md:pb-0 antialiased selection:bg-emerald-500 selection:text-slate-950">

<!-- TELA DE AUTENTICAÇÃO / LOGIN -->
<div id="auth-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-2xl relative overflow-hidden">
    <div class="absolute -top-12 -right-12 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>

    <div class="text-center space-y-2 relative z-10">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-emerald-400 flex items-center justify-center text-slate-950 font-black text-2xl mx-auto shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-futbol"></i>
      </div>
      <h1 class="text-2xl font-black font-display tracking-wide text-white uppercase">Coach Tactics <span class="text-emerald-400">Pro</span></h1>
      <p class="text-xs text-slate-400 font-medium">Plataforma Metodológica de Treinadores Profissionais</p>
    </div>
    
    <div class="space-y-3.5 text-xs relative z-10">
      <div>
        <label class="block font-bold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">E-mail do Treinador</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500"></i>
          <input type="email" id="auth-email" placeholder="treinador@futebol.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-3 py-3 text-slate-200 focus:outline-none focus:border-emerald-500 transition-all">
        </div>
      </div>
      <div>
        <label class="block font-bold text-slate-300 mb-1.5 uppercase tracking-wider text-[10px]">Palavra-passe (Senha)</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500"></i>
          <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-3 py-3 text-slate-200 focus:outline-none focus:border-emerald-500 transition-all">
        </div>
      </div>
      <div id="auth-error" class="text-rose-400 text-[11px] font-bold text-center p-2.5 bg-rose-950/40 rounded-xl border border-rose-900/50 hidden"></div>
    </div>

    <div class="space-y-2.5 relative z-10">
      <button onclick="handleLogin()" id="btn-login" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-xs rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2 uppercase tracking-wider">
        <i class="fa-solid fa-right-to-bracket"></i> Acessar Painel do Treinador
      </button>
      <button onclick="handleSignUp()" id="btn-signup" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs rounded-xl border border-slate-700 transition-all uppercase tracking-wider">
        Cadastrar Nova Conta
      </button>
    </div>

    <div class="flex justify-between items-center text-[10px] text-slate-500 pt-3 border-t border-slate-800 relative z-10">
      <span><i class="fa-solid fa-shield-halved text-emerald-500 mr-1"></i> Supabase Auth</span>
      <button onclick="forceShowSettingsFromAuth()" class="text-emerald-400 hover:underline font-semibold">Configurar Supabase</button>
    </div>
  </div>
</div>

<!-- APLICAÇÃO PRINCIPAL -->
<div id="app-container" class="hidden flex-col min-h-screen">
  <header class="border-b border-slate-800/80 bg-slate-900/90 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-slate-950 font-black text-lg shadow-md shadow-emerald-500/20">
          <i class="fa-solid fa-futbol"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="font-black text-lg tracking-tight font-display uppercase bg-gradient-to-r from-white via-slate-200 to-emerald-400 bg-clip-text text-transparent">Coach Tactics</span>
            <span class="text-[9px] bg-emerald-500/20 text-emerald-400 font-extrabold px-2 py-0.5 rounded-full border border-emerald-500/30 uppercase tracking-widest">UEFA Pro</span>
          </div>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <div class="hidden sm:flex items-center space-x-2 text-xs text-slate-300 bg-slate-950 px-3.5 py-1.5 rounded-xl border border-slate-800">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="user-email-display" class="font-bold truncate max-w-[180px]">Treinador</span>
        </div>
        <button onclick="handleLogout()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-rose-950/60 text-slate-300 hover:text-rose-400 border border-slate-700 hover:border-rose-800/60 text-xs flex items-center gap-2 transition-all">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="hidden sm:inline font-bold">Sair</span>
        </button>
      </div>
    </div>
  </header>

  <!-- NAVIGATION BAR (DESKTOP) -->
  <nav class="hidden md:flex border-b border-slate-800/60 bg-slate-900/40 px-6 py-2.5 gap-2 text-xs font-bold max-w-7xl mx-auto w-full">
    <button onclick="switchTab('dashboard')" class="tab-btn-dk px-4 py-2 rounded-xl transition-all flex items-center gap-2 bg-slate-800 text-emerald-400 border border-slate-700" data-tab="dashboard">
      <i class="fa-solid fa-chart-pie"></i> Dashboard
    </button>
    <button onclick="switchTab('ai-generator')" class="tab-btn-dk px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-slate-400 hover:text-white" data-tab="ai-generator">
      <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> Gerador Pro de Treinos
    </button>
    <button onclick="switchTab('tactical-board')" class="tab-btn-dk px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-slate-400 hover:text-white" data-tab="tactical-board">
      <i class="fa-solid fa-chalkboard-user text-emerald-400"></i> Prancheta 2D Pro
    </button>
    <button onclick="switchTab('library')" class="tab-btn-dk px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-slate-400 hover:text-white" data-tab="library">
      <i class="fa-solid fa-layer-group"></i> Biblioteca Tática
    </button>
    <button onclick="switchTab('cart')" class="tab-btn-dk px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-slate-400 hover:text-white" data-tab="cart">
      <i class="fa-solid fa-file-pen text-amber-400"></i> Ficha da Sessão
    </button>
    <button onclick="switchTab('settings')" class="tab-btn-dk px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-slate-400 hover:text-white ml-auto" data-tab="settings">
      <i class="fa-solid fa-gear"></i> Configurações
    </button>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-5 flex-1 w-full">
    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="tab-content space-y-5">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3.5">
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl relative overflow-hidden">
          <p class="text-[10px] text-slate-400 uppercase font-black tracking-wider">Elenco Principal</p>
          <p class="text-2xl font-black text-white mt-1">26 <span class="text-xs text-slate-400 font-normal">Atletas</span></p>
          <span class="text-[10px] text-emerald-400 font-bold flex items-center gap-1 mt-2">
            <i class="fa-solid fa-circle-check"></i> 100% Prontos
          </span>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
          <p class="text-[10px] text-slate-40
